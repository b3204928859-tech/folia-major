name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Create .env file
        run: |
          echo "VITE_NETEASE_API_BASE=${{ secrets.VITE_NETEASE_API_BASE }}" > .env

      - name: Install dependencies
        run: npm install

      - name: Build web version
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor
        run: npx cap init folia com.folia.app --web-dir dist

      - name: Add Android platform
        run: npx cap add android

      - name: Grant Permissions & Optimize
        run: |
          # 1. 存储权限
          sed -i 's#<application#    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n<application#' android/app/src/main/AndroidManifest.xml || true
          # 2. 允许 HTTP 明文请求，并强制开启硬件加速
          sed -i 's#<application#<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"#' android/app/src/main/AndroidManifest.xml || true
          # 3. 使用 Node.js 安全地修改样式，实现全屏沉浸模式
          node -e "
          const fs = require('fs');
          const path = 'android/app/src/main/res/values/styles.xml';
          if (fs.existsSync(path)) {
            let xml = fs.readFileSync(path, 'utf8');
            if (!xml.includes('windowFullscreen')) {
                xml = xml.replace('<item name=\"windowNoTitle\">true</item>', '<item name=\"windowNoTitle\">true</item>\n        <item name=\"android:windowFullscreen\">true</item>\n        <item name=\"android:windowLayoutInDisplayCutoutMode\">shortEdges</item>\n        <item name=\"android:windowTranslucentStatus\">true</item>');
                fs.writeFileSync(path, xml);
            }
          }
          "

      - name: Copy web assets
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: folia-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
