name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm' # 开启 Node.js 依赖缓存，加速打包

      - name: Create .env file
        run: |
          echo "VITE_NETEASE_API_BASE=${{ secrets.VITE_NETEASE_API_BASE }}" > .env

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor & Fullscreen Plugin
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/status-bar

      - name: Optimize Touch & Inject Fullscreen
        run: |
          # 触控优化：禁用缩放，消除 300ms 延迟
          sed -i 's#<head>#<head>\n    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">\n    <style>\n      html, body, #app { touch-action: manipulation; overscroll-behavior: none; }\n    </style>#' index.html
          # 注入全屏插件
          sed -i 's#</body>#    <script type="module">\n      import { StatusBar } from "@capacitor/status-bar";\n      StatusBar.hide();\n      StatusBar.setOverlaysWebView({ overlay: true });\n    </script>\n</body>#' index.html

      - name: Build web version
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create Capacitor Config (Startup Optimization)
        run: |
          # 强制使用深色背景防止启动白屏（改用 Python 写入，避开引号冲突）
          python3 -c '
          import json
          config = {
            "appId": "com.folia.app",
            "appName": "Folia",
            "webDir": "dist",
            "server": { "androidScheme": "https" },
            "android": { 
              "backgroundColor": "#121212", 
              "allowMixedContent": True, 
              "webContentsDebuggingEnabled": False 
            }
          }
          with open("capacitor.config.json", "w") as f:
              json.dump(config, f, indent=2)
          '

      - name: Add Android platform
        run: npx cap add android

      # ================== 缓存 Gradle 依赖 ==================
      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      # =======================================================

      - name: Optimize APK Size & Permissions
        run: |
          # 1. 限制只打包 arm64-v8a 架构，缩减体积
          sed -i '/defaultConfig {/a\        ndk {\n            abiFilters "arm64-v8a"\n        }' android/app/build.gradle

          # 2. 存储权限
          sed -i 's#</application>#    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n</application>#' android/app/src/main/AndroidManifest.xml

          # 3. 允许 HTTP 明文请求，强制硬件加速
          sed -i 's#<application#<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"#' android/app/src/main/AndroidManifest.xml

          # 4. 全屏和沉浸模式（原生层面）
          sed -i 's#</style>#    <item name="android:windowFullscreen">true</item>\n    <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n    <item name="android:windowTranslucentStatus">true</item>\n</style>#' android/app/src/main/res/values/styles.xml

      - name: Configure Release Signing (Use Debug Key)
        run: |
          sed -i 's#release {#release {\n                signingConfig signingConfigs.debug#' android/app/build.gradle

      - name: Copy web assets
        run: npx cap sync android

      - name: Build APK (Release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: folia-release-apk
          path: android/app/build/outputs/apk/release/*.apk
