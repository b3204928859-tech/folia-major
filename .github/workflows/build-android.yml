name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Create .env file
        run: |
          echo "VITE_NETEASE_API_BASE=${{ secrets.VITE_NETEASE_API_BASE }}" > .env

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor & Fullscreen Plugin
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/status-bar

      - name: Optimize Touch & Inject Fullscreen
        run: |
          python3 -c '
          import re
          with open("index.html", "r", encoding="utf-8") as f:
              html = f.read()
          meta = "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\">"
          style = "<style>html, body, #app { touch-action: manipulation; overscroll-behavior: none; }</style>"
          if "<meta name=\"viewport\"" in html:
              html = re.sub(r"<meta name=\"viewport\"[^>]*>", meta, html)
          else:
              html = html.replace("<head>", "<head>\n" + meta)
          if "</head>" in html:
              html = html.replace("</head>", style + "\n</head>")
          injection = """<script type=\"module\">
            import { StatusBar } from \"@capacitor/status-bar\";
            StatusBar.hide();
            StatusBar.setOverlaysWebView({ overlay: true });
          </script>"""
          if "capacitor/status-bar" not in html:
              html = html.replace("</body>", injection + "\n</body>")
          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html)
          '

      - name: Build web version
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create Capacitor Config (Startup Optimization)
        run: |
          python3 -c '
          import json
          config = {
            "appId": "com.folia.app",
            "appName": "Folia",
            "webDir": "dist",
            "server": { "androidScheme": "https" },
            "android": { 
              "backgroundColor": "#121212", 
              "allowMixedContent": True, 
              "webContentsDebuggingEnabled": False 
            }
          }
          with open("capacitor.config.json", "w") as f:
              json.dump(config, f, indent=2)
          '

      - name: Add Android platform
        run: npx cap add android

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Replace App Icon
        run: |
          if [ -f "icon.png" ]; then
            for dpi in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
              cp icon.png android/app/src/main/res/mipmap-$dpi/ic_launcher.png || true
              cp icon.png android/app/src/main/res/mipmap-$dpi/ic_launcher_round.png || true
              cp icon.png android/app/src/main/res/mipmap-$dpi/ic_launcher_foreground.png || true
            done
            echo "图标替换成功！"
          else
            echo "未找到 icon.png，保留默认图标。"
          fi

      - name: Optimize APK Size & Permissions
        run: |
          sed -i '/defaultConfig {/a\        ndk {\n            abiFilters "arm64-v8a"\n        }' android/app/build.gradle
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n<application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"#' android/app/src/main/AndroidManifest.xml
          sed -i 's#</style>#    <item name="android:windowFullscreen">true</item>\n    <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n    <item name="android:windowTranslucentStatus">true</item>\n</style>#' android/app/src/main/res/values/styles.xml

      - name: Configure Release Signing (Use Debug Key)
        run: |
          sed -i 's#release {#release {\n                signingConfig signingConfigs.debug#' android/app/build.gradle

      - name: Copy web assets
        run: npx cap sync android

      - name: Build APK (Release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: folia-release-apk
          path: android/app/build/outputs/apk/release/*.apk
