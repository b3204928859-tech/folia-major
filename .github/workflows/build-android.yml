name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Create .env file
        run: |
          echo "VITE_NETEASE_API_BASE=${{ secrets.VITE_NETEASE_API_BASE }}" > .env

      - name: Install dependencies
        run: npm install

      - name: Build web version
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor
        run: npx cap init folia com.folia.app --web-dir dist

      - name: Add Android platform
        run: npx cap add android

      - name: Grant Permissions & Enable Fullscreen
        run: |
          # 1. 存储权限
          sed -i 's#<application#    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n<application#' android/app/src/main/AndroidManifest.xml || true
          # 2. 允许 HTTP 明文请求（防止本地接口被拦截）
          sed -i 's#<application#<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"#' android/app/src/main/AndroidManifest.xml || true
          # 3. 开启全屏模式，内容延伸到刘海屏区域
          sed -i 's#</style>#    <item name="android:windowFullscreen">true</item>\n    <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n</style>#' android/app/src/main/res/values/styles.xml || true

      - name: Copy web assets
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: folia-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
